# config/agentic.example.toml
mode = "shadow"  # shadow | live
strategy = "fixture"  # fixture | spy_scalper | llm
# --- Phase 3 autonomous loop -------------------------------------------------
# Quote source: "file" tails a collector-written JSONL; "mcp" polls
# get_equity_quotes through the authenticated broker (no collector needed).
quote_source = "file"  # file | mcp
session_policy = "regular"  # regular | extended | all | any
# Order construction: "market" uses dollar-based buys in regular hours (the only
# way to trade fractional shares); "limit" posts a marketable limit at the touch
# and is required for whole-share trading outside regular hours.
order_type = "market"  # market | limit
poll_seconds = 5.0
# Hard bound on entries per local day, in addition to the notional caps.
max_orders_per_day = 10
# Trip the kill switch after this many consecutive broker placement errors.
max_consecutive_errors = 3
# Reject quotes whose source timestamp is older than this (latency guard).
max_quote_age_seconds = 60.0
# Leave unset to auto-select the single agentic_allowed account.
# account_number = "123456789"
# --- Phase 4 self-evaluation, promotion and autonomy --------------------------
# manual   = operator switches stages by hand (default, safest)
# assisted = the bot re-evolves and records a verdict, but never promotes itself
# auto     = the bot may promote/demote itself, and ONLY when
#            AGENTIC_ALLOW_AUTONOMY=1 is exported for that session
autonomy = "manual"
# Bars for evolution, evidence and the trend rule: a directory of
# `<SYMBOL>_day.jsonl` files, written by fetch-history / import-history or by the
# daemon's own history refresh. The repo ships daily bars so this works offline.
history_path = "data/bars"
evolution_interval_minutes = 60   # 0 disables periodic evolution
evolution_population = 24
evolution_generations = 6
promotion_cycles_required = 3     # consecutive passing assessments per stage
min_oos_trades = 30               # out-of-sample sample floor for promotion
# For Phase 1 SPY scalper (shadow by default):
# strategy = "spy_scalper"
# scalper_config = "config.json"
# For Phase 2 LLM multi-asset (shadow by default; Fake LLM without AGENTIC_LLM_API_KEY):
# strategy = "llm"
# symbol_whitelist = ["SPY", "QQQ", "IWM"]  # RiskGuard still enforces whitelist
symbol_whitelist = ["SPY"]
max_order_pct = "0.05"
daily_notional_pct = "0.20"
daily_loss_pct = "0.03"
max_open_positions = 1
# Small-account mode. A $1.00 minimum order is 2% of a $50 account, so a 1%
# per-order ceiling can never place one: the agent refuses every entry with
# `below_min_notional`. Setting this above zero authorises a temporary, larger
# per-order cap — used only while the account is too small to place an
# evidence-compliant order, released automatically once it is big enough, and
# reported on the console with the drawdown the walk-forward measured at that
# size. 0 disables the rule and the agent simply refuses to trade until the
# account grows.
small_account_max_order_pct = "0"
# "flat" gives every entry the same dollars. "proportional" scales the budget by
# the strategy's inverse-volatility weight (1.0 = a 20%-vol asset), which on this
# universe earns the same bps per trade with roughly a third of the drawdown.
sizing = "flat"
# --- Symbol scout: let the agent add and drop symbols from data --------------
# Off by default: the whitelist you wrote is the set of instruments this account
# is authorised to trade until you say otherwise. With it on, the scout reads
# Robinhood's own discovery lists (trending stocks, daily movers, most popular,
# tradable crypto, altcoins) plus `discovery_lists`/`discovery_candidates` below,
# grades every name with the same rule the book trades, and adopts its own picks.
# It can never remove a symbol you configured, and never drops one the book still
# holds. Adoption also needs the session's autonomy switch (AGENTIC_ALLOW_AUTONOMY=1):
# a config file is policy, letting the agent choose symbols you never named is
# permission. Try it first with: agentic-trading discover --config ... --dry-run
discovery_enabled = false
# How often the daemon re-scans. Bars change daily at most.
discovery_interval_hours = 6.0
# Ceiling on scout-added symbols, on top of your whitelist. 0 disables the scout
# even when discovery_enabled is true.
discovery_max_symbols = 6
# Curated/personal list names to read; empty means the built-in default set.
# discovery_lists = ["Trending stocks", "Daily movers", "Tradable crypto"]
# Extra symbols to grade that may not be on any list (stocks have no public
# "trading now" feed from the broker's read tools, so name them here).
# discovery_candidates = ["COIN", "MSTR", "IBIT"]
# Filters. A candidate must have this much daily history, trade this many dollars
# a day, cost no more than this spread to cross, and not move more than this in
# step with something already held.
discovery_min_bars = 260
discovery_min_dollar_volume = "5000000"
discovery_max_spread_bps = "25"
discovery_max_correlation = "0.85"
# Poll at most this many candidates per pass (keeps the scout's network work
# bounded); oldest-unseen first.
discovery_max_candidates = 40
# Add on a strong trend vote, drop on a weak one, and never re-decide an adopted
# symbol before this many hours have passed — the gap between the two is what
# stops a symbol being added and dropped on the same wobble.
discovery_enter_vote = "0.75"
discovery_exit_vote = "0.25"
discovery_min_hold_hours = 48.0
equity_refresh_ticks = 30
equity_refresh_seconds = 60
timezone = "local"
quotes_path = "data/spy_quotes.jsonl"
journal_dir = "data/journal"
state_dir = "data/state"
tools_snapshot_path = "data/tools_snapshot.json"
token_path = "~/.config/agentic-trading/tokens.json"
mcp_url = "https://agent.robinhood.com/mcp/trading"
# capability names filled after first tools/list; leave empty to auto-map by heuristics + confirm
