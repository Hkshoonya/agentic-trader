# Copy to config/secrets.toml, fill in your keys, then: chmod 600 config/secrets.toml
# config/secrets.toml is git-ignored and must never be committed or pasted anywhere.
# Leave out any account you do not use.

[alpaca_paper]          # https://app.alpaca.markets -> Paper account -> API keys
key = "PK..."
secret = "..."

[alpaca_live]           # the live account's own keys (read-only until you arm it)
key = "AK..."
secret = "..."

[coinbase]              # Coinbase Developer Platform -> API key (ECDSA), "trade" permission
key = "organizations/<org_id>/apiKeys/<key_id>"
secret = """-----BEGIN EC PRIVATE KEY-----
...
-----END EC PRIVATE KEY-----"""
