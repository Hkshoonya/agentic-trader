name: windows-build
run-name: Build the Windows app (${{ github.ref_name }})

# Builds the Windows app on a Windows runner, so a machine with no Windows and
# no Wine can still produce the executable. The zip is attached to the run; a
# tag pushes it to a release.

on:
  workflow_dispatch:
  # Every pull request to the protected branch gets the same build and smoke
  # test, so a contribution cannot merge on a green Linux-only run.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install ".[dev]" pyinstaller
          python -m pytest tests -q
          python -m PyInstaller --noconfirm --clean windows/AgenticTrader.spec

      - name: Check the documented test count
        shell: pwsh
        run: python tools/check_doc_counts.py

      - name: Smoke-test the frozen build
        shell: pwsh
        run: |
          # The launcher seeds a workspace and reports what it found. Testing
          # against the bare example config instead would fail every run: that
          # config has no history_path, so the analysis checks have nothing to
          # analyse, which is correct behaviour and a useless gate.
          #
          # Start-Process, not a bare call: the launcher is a GUI-subsystem
          # executable, so PowerShell does not wait for it and $LASTEXITCODE is
          # left unset — which fails the job even when the app worked.
          $smoke = Join-Path $env:TEMP "agentic-smoke"
          $launcher = Start-Process -FilePath "./dist/AgenticTrader/AgenticTrader.exe" `
            -ArgumentList "--selftest", "--workspace", $smoke -Wait -PassThru -NoNewWindow
          if ($launcher.ExitCode -ne 0) { throw "launcher self-test failed ($($launcher.ExitCode))" }

          # Start the frozen console and prove it answers over HTTP — on
          # Windows, where the dashboard has never run before.
          $dash = Start-Process -FilePath "./dist/AgenticTrader/agentic-trading.exe" `
            -ArgumentList "dashboard", "--config", "$smoke/config/agentic.toml", "--port", "8787" `
            -PassThru -NoNewWindow
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8787/api/summary" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match '"mode"') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "frozen dashboard never answered" }

            # The CLI is a console app, so a bare call is fine here.
            & "./dist/AgenticTrader/agentic-trading.exe" selfcheck --offline --config "$smoke/config/agentic.toml"
            if ($LASTEXITCODE -ne 0) { throw "frozen CLI self-check failed" }
          } finally {
            if ($dash -and -not $dash.HasExited) { Stop-Process -Id $dash.Id -Force }
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/AgenticTrader/* -DestinationPath dist/AgenticTrader-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AgenticTrader-windows-x64
          path: dist/AgenticTrader-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgenticTrader-windows-x64.zip
