name: windows-build
run-name: Build the Windows app (${{ github.ref_name }})

# Builds the Windows app on a Windows runner, so a machine with no Windows and
# no Wine can still produce the executable. The zip is attached to the run; a
# tag pushes it to a release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install ".[dev]" pyinstaller
          python -m pytest tests -q
          python -m PyInstaller --noconfirm --clean windows/AgenticTrader.spec

      - name: Smoke-test the frozen build
        shell: pwsh
        run: |
          # The launcher seeds a workspace and reports what it found. Testing
          # against the bare example config instead would fail every run: that
          # config has no history_path, so the analysis checks have nothing to
          # analyse, which is correct behaviour and a useless gate.
          $smoke = Join-Path $env:TEMP "agentic-smoke"
          ./dist/AgenticTrader/AgenticTrader.exe --selftest --workspace $smoke
          if ($LASTEXITCODE -ne 0) { throw "launcher self-test failed" }
          ./dist/AgenticTrader/agentic-trading.exe selfcheck --offline --config "$smoke/config/agentic.toml"
          if ($LASTEXITCODE -ne 0) { throw "frozen CLI self-check failed" }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/AgenticTrader/* -DestinationPath dist/AgenticTrader-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AgenticTrader-windows-x64
          path: dist/AgenticTrader-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgenticTrader-windows-x64.zip
