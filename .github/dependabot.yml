version: 2
updates:
  # The runtime has one dependency (httpx) plus tzdata on Windows, and the
  # broker/LLM clients are the only things it trusts over the network. Keep them
  # patched without a human remembering to look.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  # The Windows build and the test workflow run on action versions that get
  # deprecated on a schedule (Node 20 → 24 already bit us once).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["ci"]
    commit-message:
      prefix: "ci"
